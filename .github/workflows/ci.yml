# Every push: typecheck, build, and prove the engine still equals Habitica's own code.
name: CI
on:
  # branches get their runs from their pull request; a push run as well would only repeat it
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 20 is what Habitica's server runs, so Math.sin here is the reference the sine test compares against
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Lint the workflow files (a YAML slip silently disables a workflow)
        run: pipx run --spec actionlint-py actionlint
      - run: npm run typecheck
      - name: Habitica release the rules were checked against
        id: tag
        # (a block scalar: the plain form's "checkedAgainst: " would be read as a YAML mapping and break the file)
        run: |
          echo "tag=$(node -e "console.log(require('fs').readFileSync('src/engine/rules.ts','utf8').match(/checkedAgainst: '([^']+)'/)[1])")" >> "$GITHUB_OUTPUT"
      - name: Clone Habitica ${{ steps.tag.outputs.tag }}
        run: git clone --depth 1 --branch ${{ steps.tag.outputs.tag }} https://github.com/HabitRPG/habitica ../habitica
      # the build needs it too: the made-up account behind "Try it" runs Habitica's code in the app
      - run: npm run harness -- ../habitica
      - run: npm run build
      - name: Nothing newer than the oldest Android 9 WebView (Chrome 66) without a fallback (scripts, then the built CSS)
        run: npm run lint
      # every suite, the same list as a local `npm test` (sine, parity, gear, history, playground, sprites, avatar, scenes, picks, growth, reactions)
      - run: npm test

  # beside verify, not after it: it needs nothing verify makes, and it's the longest job
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Clone Habitica
        run: |
          TAG=$(node -e "console.log(require('fs').readFileSync('src/engine/rules.ts','utf8').match(/checkedAgainst: '([^']+)'/)[1])")
          git clone --depth 1 --branch "$TAG" https://github.com/HabitRPG/habitica ../habitica
      - run: npm run harness -- ../habitica
      # Chromium 67, the oldest WebView an Android 9 phone can have, for tests/old-webview.cjs (downloaded once, then cached)
      - uses: actions/cache@v4
        with: { path: ~/.cache/sidekick, key: chromium-550430 }
      - run: VITE_TEST_API=http://127.0.0.1:3001 VITE_AUTO_READ_MS=3000 npx vite build --outDir dist-e2e
      - name: Run the site against a mock Habitica built from Habitica's code
        run: |
          node tools/mock-server.mjs --port 3001 --rate 1000 &
          npx vite preview --outDir dist-e2e --host 127.0.0.1 --port 4173 --strictPort &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:3001/mock/state >/dev/null && curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/e2e.cjs screenshots
          node --experimental-websocket tests/old-webview.cjs old-webview
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: screenshots }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: old-webview, path: old-webview }

  # The Android app: the Java verdict against vectors from the TypeScript engine, then a debug APK.
  # Nothing is published: the APK is a workflow artifact. Public releases are release.yml's, from a version tag.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the Capacitor CLI needs Node 22+; the engine's numbers don't depend on the Node version (it carries its own sine)
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - name: Write the shared dev signing key (absent on PRs from forks and Dependabot; the APK then gets a throwaway key)
        env:
          DEV_KEYSTORE_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEV_KEYSTORE_B64" ]; then
            printf '%s' "$DEV_KEYSTORE_B64" | base64 -d > android/app/dev-debug.keystore
          else
            echo "::warning::DEV_KEYSTORE_B64 is not set; this APK is signed with a throwaway key and won't install over a dev build"
          fi
      # the web bundle carries Habitica's code for the made-up account, and the night gear swap is tested against its own equip and cron, in the mock
      - name: Clone Habitica
        run: |
          TAG=$(node -e "console.log(require('fs').readFileSync('src/engine/rules.ts','utf8').match(/checkedAgainst: '([^']+)'/)[1])")
          git clone --depth 1 --branch "$TAG" https://github.com/HabitRPG/habitica ../habitica
      - run: npm run harness -- ../habitica
      - name: Build the web bundle and copy it into the Android project
        run: |
          npm run android:sync
          # Capacitor's logging puts plugin calls (the API token among them) in logcat; capacitor.config.ts keeps it off
          grep -q '"loggingBehavior": "none"' android/app/src/main/assets/capacitor.config.json || { echo "::error::capacitor.config.ts must keep loggingBehavior: 'none'"; exit 1; }
      - name: Export the verdict test vectors from the TypeScript engine
        run: npm run android:fixtures
      - name: Java verdict and night gear tests, then the debug APK (the runner image ships the Android SDK)
        run: |
          node tools/mock-server.mjs --port 3001 --rate 1000 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:3001/mock/state >/dev/null && break; sleep 1; done
          cd android && ./gradlew --no-daemon :verdict:test -PmockUrl=http://127.0.0.1:3001 assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sidekick-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Android Lint (errors fail the job, warnings are only reported; android/app/build.gradle)
        run: cd android && ./gradlew --no-daemon :app:lintDebug

  # main only: the newest APK as the rolling pre-release "Latest dev build" (tag dev-latest), one tap to download on a phone.
  dev-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - name: Refuse to publish an APK that won't install over the last one
        env:
          DEV_KEYSTORE_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEV_KEYSTORE_B64" ]; then
            echo "::error::Add the DEV_KEYSTORE_B64 repository secret (docs/android-testing.md) before the Latest dev build can be published"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with: { name: sidekick-debug-apk }
      - name: Replace the Latest dev build with this commit's APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk sidekick-for-habitica-dev.apk
          notes="Debug build of ${GITHUB_SHA::7} on main ($(date -u +%Y-%m-%d)). Not a release. Install steps and test checklist: docs/android-testing.md"
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest sidekick-for-habitica-dev.apk --prerelease --target "$GITHUB_SHA" --title "Latest dev build" --notes "$notes"
