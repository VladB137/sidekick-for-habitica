# A public release: pushing a version tag (v1.0.0) builds the release APK, signed with the release key, and opens a
# draft GitHub Release with it. Nothing is published until Vlad presses Publish on the draft. Steps: docs/releasing.md.
# The tag must point at a commit on main (CI already passed there) and match package.json's version.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main and matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then echo "::error::tag $TAG but package.json says $VERSION: bump package.json on main first"; exit 1; fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then echo "::error::$TAG points at a commit that isn't on main"; exit 1; fi
      # the Capacitor CLI needs Node 22+
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      # the web bundle carries Habitica's code for the made-up account behind "Try it"
      - name: Clone Habitica
        run: |
          TAG=$(node -e "console.log(require('fs').readFileSync('src/engine/rules.ts','utf8').match(/checkedAgainst: '([^']+)'/)[1])")
          git clone --depth 1 --branch "$TAG" https://github.com/HabitRPG/habitica ../habitica
      - run: npm run harness -- ../habitica
      - name: Build the web bundle and copy it into the Android project
        run: |
          npm run android:sync
          grep -q '"loggingBehavior": "none"' android/app/src/main/assets/capacitor.config.json || { echo "::error::capacitor.config.ts must keep loggingBehavior: 'none'"; exit 1; }
      - name: Build the release APK, signed with the release key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the RELEASE_KEYSTORE_B64 and RELEASE_KEYSTORE_PASSWORD repository secrets (docs/releasing.md)"; exit 1
          fi
          RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$RELEASE_KEYSTORE"
          export RELEASE_KEYSTORE
          (cd android && ./gradlew --no-daemon assembleRelease)
          rm -f "$RELEASE_KEYSTORE"
      - name: Check the APK (signed, not debuggable, the right version) and write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          OUT="sidekick-for-habitica-$VERSION.apk"
          cp "$APK" "$OUT"
          "$TOOLS/apksigner" verify --print-certs "$OUT" > certs.txt
          CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certs.txt)
          [ -n "$CERT" ] || { echo "::error::the APK isn't signed"; exit 1; }
          BADGING=$("$TOOLS/aapt2" dump badging "$OUT")
          if grep -q "application-debuggable" <<<"$BADGING"; then echo "::error::the release APK is debuggable"; exit 1; fi
          grep -q "versionName='$VERSION'" <<<"$BADGING" || { echo "::error::the APK's versionName isn't $VERSION"; exit 1; }
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          {
            echo "Sidekick for Habitica $VERSION for Android 9 and newer. Not affiliated with or endorsed by Habitica."
            echo
            echo "Install: download \`$OUT\` on the phone, open it, allow installing from your browser when Android asks."
            echo
            if [ -f "docs/release-notes/$VERSION.md" ]; then cat "docs/release-notes/$VERSION.md"
            else echo "_What's new: write it here before publishing (new levers must be listed)._"; fi
            echo
            echo "APK SHA-256: \`$SHA\`"
            echo "Signing certificate SHA-256: \`$CERT\`"
          } > notes.md
          cat notes.md
      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "sidekick-for-habitica-${TAG#v}.apk" --draft --verify-tag --title "Sidekick for Habitica ${TAG#v}" --notes-file notes.md
